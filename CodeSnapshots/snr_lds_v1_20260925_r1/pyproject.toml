[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ba-lds"
version = "0.1.0"
description = "Background-Adaptive LDS and reproducible attribution benchmarks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6"]

[project.optional-dependencies]
train = ["torch>=2.6", "torchvision>=0.21", "datasets>=4.7,<5", "Pillow>=10", "safetensors>=0.4", "huggingface-hub>=0.23", "transformers>=4.44"]
latent = ["diffusers>=0.30", "transformers>=4.44", "accelerate>=0.33", "sentencepiece>=0.2"]
projection = ["traker>=0.3"]
figures = ["matplotlib>=3.8", "pandas>=2"]
dev = ["pytest>=8", "build>=1"]

[project.scripts]
balds = "balds.cli.ba:main"
balds-run = "balds.cli.main:main"
balds-repeat = "balds.cli.repeatability:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["balds*"]

[tool.setuptools.package-data]
balds = ["conf/*.yaml", "conf/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
